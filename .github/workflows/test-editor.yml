name: Test article editor
on:
  push:
    branches: [main]
    paths: ['editor-server/**', 'source/editor/**', '.github/workflows/test-editor.yml']
  pull_request:
    paths: ['editor-server/**', 'source/editor/**', '.github/workflows/test-editor.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor-server/package-lock.json
      - run: npm ci
      - run: npm run build:editor
      - run: npm test

# Inject
# Insert the code to head (before '</head>' tag) and the bottom (before '</body>' tag)
inject:
  head:
    # 自定义css
    - <link rel="stylesheet" href="/css/custom.css" media="defer" onload="this.media='all'">
    # CDN备用加载脚本
    - |
      <script>
        // CDN备用加载机制
        (function() {
          var cdnList = [
            'fastly.jsdelivr.net',
            'gcore.jsdelivr.net', 
            'testingcf.jsdelivr.net',
            'cdn.jsdelivr.net'
          ];
          
          function loadWithFallback(url, callback) {
            var current = 0;
            function tryLoad() {
              var testUrl = url.replace('fastly.jsdelivr.net', cdnList[current]);
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = testUrl;
              link.onerror = function() {
                current++;
                if (current < cdnList.length) {
                  tryLoad();
                } else if (callback) callback();
              };
              link.onload = function() {
                if (callback) callback();
              };
              document.head.appendChild(link);
            }
            tryLoad();
          }
          
          function loadScriptWithFallback(url, callback) {
            var current = 0;
            function tryLoad() {
              var testUrl = url.replace('fastly.jsdelivr.net', cdnList[current]);
              var script = document.createElement('script');
              script.src = testUrl;
              script.onerror = function() {
                current++;
                if (current < cdnList.length) {
                  tryLoad();
                } else if (callback) callback();
              };
              script.onload = function() {
                if (callback) callback();
              };
              document.head.appendChild(script);
            }
            tryLoad();
          }
          
          // 存储备用加载函数到全局
          window.loadWithFallback = loadWithFallback;
          window.loadScriptWithFallback = loadScriptWithFallback;
        })();
      </script>
  bottom:
    # aplayer音乐
    - <div class="aplayer no-destroy" data-id="13050639033" data-server="netease" data-type="playlist" 
     data-order="list" data-fixed="true" data-preload="auto" data-autoplay="false" data-mutex="true" ></div>

